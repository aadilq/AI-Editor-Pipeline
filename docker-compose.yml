services:
    fastapi:
        build: .
        container_name: fastapi-service
        command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
          - "8000:8000"
        env_file:
          - .env
        environment:
          - DATABASE_URL=postgresql://POSTGRES_USER:ffmpeg0895%@postgres:5432/clipdb
        restart: unless-stopped
        depends_on:
          redis:
              condition: service_healthy
          postgres:
              condition: service_healthy
        volumes:
          - ./clips:/app/clips
          - ./credentials.json:/app/credentials.json
    redis:
        image: redis:7.2
        container_name: redis-queue
        ports:
          - "6379:6379"
        volumes:
        - redis-data:/data
        command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
        restart: unless-stopped
        healthcheck:
          test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
          interval: 10s
          timeout: 5s
          retries: 5
    celery:
        build: .
        container_name: celery-worker
        command: ["celery", "-A", "worker.tasks", "worker", "--loglevel=INFO", "--concurrency=1"]
        env_file:
          - .env
        environment:
          - DATABASE_URL=postgresql://POSTGRES_USER:ffmpeg0895%@postgres:5432/clipdb
        restart: unless-stopped
        depends_on:
          redis:
              condition: service_healthy
          postgres:
              condition: service_healthy
        volumes:
            - ./clips:/app/clips
            - ./credentials.json:/app/credentials.json
    postgres:
      image: postgres:16-alpine
      container_name: postgres-db
      restart: unless-stopped
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DB}"]
        interval: 10s
        timeout: 5s
        retries: 5
      environment:
        POSTGRES_USER: ${POSTGRES_USERNAME}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: clipdb
      ports:
        - "5434:5432"
      volumes:
        - pgdata:/var/lib/postgresql/data

volumes:
  redis-data:
      driver: local
  pgdata:
      driver: local



